name: Deploy GitHub Pages

on:
  push:
    branches: [rock, feature/dsb-land-redesign]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out live site
        uses: actions/checkout@v6
        with:
          ref: rock
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/configure-pages@v5

      - name: Refresh Oogatron activity snapshot
        run: node scripts/jumbotron-data.mjs "$OOGATRON_STATS_URL"
        env:
          OOGATRON_STATS_URL: https://oogatron.sterlingbreck.workers.dev/v2/stats

      - name: Build live site
        run: |
          npm run build
          mkdir -p _site
          cp oogaboogaland.html _site/index.html

      - name: Check out DSB Land preview
        uses: actions/checkout@v6
        with:
          ref: feature/dsb-land-redesign
          path: dsb-preview-src
          persist-credentials: false

      - name: Build DSB Land preview
        run: |
          cd dsb-preview-src
          npm run build
          mkdir -p ../_site/dsb-preview
          cp oogaboogaland.html ../_site/dsb-preview/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
