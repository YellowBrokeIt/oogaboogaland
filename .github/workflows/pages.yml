name: Deploy DSB Preview

on:
  push:
    branches: [feature/dsb-land-redesign]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dsb-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out stable rock
        uses: actions/checkout@v6
        with:
          ref: rock
          path: live-src
          persist-credentials: false

      - name: Check out DSB redesign
        uses: actions/checkout@v6
        with:
          ref: feature/dsb-land-redesign
          path: preview-src
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/configure-pages@v5

      - name: Stage stable site
        run: |
          mkdir -p _site
          cp live-src/oogaboogaland.html _site/index.html

      - name: Build and stage DSB preview
        run: |
          cd preview-src
          npm run build
          mkdir -p ../_site/dsb-preview
          cp oogaboogaland.html ../_site/dsb-preview/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
