name: DSB PR600 survey camera visual review
on:
  push:
    branches: [validation/dsb-pr600-visual-survey-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  survey:
    name: Sea-facing Chora, harbor and Olympus (desktop/phone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Rebuild merged-upstream DSB game
        run: npm run build
      - name: Sea-facing, detached-camera game survey
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -x "$CHROME"
          CHROME="$CHROME" node test/dsb-pr600-visual-survey.mjs
      - name: Upload sea-facing camera screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dsb-pr600-chora-harbor-olympus-survey
          path: shoreline-survey-artifacts/*.png
          if-no-files-found: ignore
