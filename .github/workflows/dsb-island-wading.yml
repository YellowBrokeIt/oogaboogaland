name: DSB island shoreline validation

on:
  push:
    branches: [feature/dsb-island-wading]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsb-island-wading-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoreline:
    name: Coast sectors, navigation and ocean optics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Island-wide shoreline regression tests
        run: node --test test/dsb-island-wading.test.mjs
      - name: Full browser-free unit lane
        run: npm run test:unit
      - name: Verify production single-page build
        run: npm run build
      - name: Browser review at desktop and mobile viewport sizes
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" 
          test -x "$CHROME"
          CHROME="$CHROME" node test/dsb-island-browser.mjs
      - name: Upload shoreline browser screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dsb-shoreline-browser-review
          path: shoreline-browser-artifacts/*.png
          if-no-files-found: ignore
