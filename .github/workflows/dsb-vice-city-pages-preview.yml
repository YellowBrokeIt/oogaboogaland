name: Build Downloadable DSB Night Preview

on:
  push:
    branches: [feature/dsb-vice-city-night-lighting]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build portable one-page DSB game
        run: |
          npm run build
          mkdir -p untracked/dsb-night-playable/src/js
          cp oogaboogaland.html untracked/dsb-night-playable/index.html
          if test -d src/maxis-player; then cp -R src/maxis-player untracked/dsb-night-playable/src/maxis-player; fi
          if test -f src/js/maxis-media-data.js; then cp src/js/maxis-media-data.js untracked/dsb-night-playable/src/js/maxis-media-data.js; fi
          test -s untracked/dsb-night-playable/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dsb-vice-city-night-playable
          path: untracked/dsb-night-playable/
          if-no-files-found: error
