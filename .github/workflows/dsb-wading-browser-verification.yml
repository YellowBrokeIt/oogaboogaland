name: PR600 focused Chrome shoreline verification (validation only)

on:
  push:
    branches:
      - validation/dsb-wading-browser-031697ca

permissions:
  contents: read

jobs:
  shoreline-smoke:
    name: 34-sector desktop and phone real-avatar browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Select installed Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Chrome not found"
            exit 1
          fi
          echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Build game and check syntax
        run: |
          npm run build
          node --check scripts/dsb-pr600-browser-validation.mjs
          node --check src/js/dsb-coast.js
          node --check src/js/dsb-geography.js
          node --check src/js/dsb-water.js
      - name: Run focused current-avatar browser regression (desktop and phone)
        shell: bash
        run: |
          set -o pipefail
          node scripts/dsb-pr600-browser-validation.mjs 2>&1 | tee "$RUNNER_TEMP/dsb-pr600-smoke.log"
      - name: Upload logs and 10 viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsb-pr600-real-avatar-browser
          path: |
            ${{ runner.temp }}/dsb-pr600-smoke.log
            ${{ runner.temp }}/shoreline-browser-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
