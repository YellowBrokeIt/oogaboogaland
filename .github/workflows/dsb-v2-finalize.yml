name: DSB Night v2 Finalize and Package (Temporary)

on:
  push:
    branches: [feature/dsb-vice-city-night-lighting]

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current DSB lighting branch
        uses: actions/checkout@v6
        with:
          ref: feature/dsb-vice-city-night-lighting
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Re-pin intentionally changed DSB water fragment, preserving strict shader snapshot test
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from "node:fs";
          const path="test/run.mjs";
          const old='"a5600e80e22eaa8b0c5f7bd50a087bf2165bc07401f73f41abea2cdf1aa59496",';
          const replacement='// DSB night v2 adds opt-in colored-water glints to DSB water faces only.\n    // Intentional fragment rebaseline; the pinned vertex and shadow byte hashes stay unchanged.\n    "ea39194f927f6809ad5ebcc288fca2a8bd414136c2c7ef49b7bccd6b7e08e3a1",';
          const source=readFileSync(path,"utf8");
          if(source.includes(replacement)){console.log("DSB night fragment snapshot already pinned");process.exit(0);}
          if(source.split(old).length!==2)throw Error("Unexpected canonical fragment snapshot; refusing to modify");
          if(!source.includes('record("race rig strategy: ordinary mesh, fragment and shadow shader bytes retain the pre-rig fast path"'))throw Error("Shader byte-regression check missing");
          writeFileSync(path,source.replace(old,replacement));
          console.log("Re-pinned only intentionally changed fragment hash");
          NODE
          git diff --check
          if ! git diff --quiet -- test/run.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add test/run.mjs
            git commit -m "Re-pin shader byte hash for deliberate DSB nighttime water glints"
            git push origin HEAD:refs/heads/feature/dsb-vice-city-night-lighting
          fi
      - name: Run unchanged, strict regression test lane
        run: npm run test:unit
      - name: Build the portable night game
        run: |
          npm run build
          mkdir -p untracked/dsb-night-v2-playable
          cp oogaboogaland.html untracked/dsb-night-v2-playable/index.html
          test -s untracked/dsb-night-v2-playable/index.html
      - name: Upload offline playable HTML
        uses: actions/upload-artifact@v4
        with:
          name: dsb-vice-city-v2-playable
          path: untracked/dsb-night-v2-playable/
          if-no-files-found: error
